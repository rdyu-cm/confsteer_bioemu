# Train a TopK SAE on YOUR OWN sequences.
#
#   uv run confsteer sae-encode --config configs/examples/train_sae_own_data.yaml \
#       --fasta my.fasta
#
# Every path below uses ${SAE_DATA_ROOT} / ${SAE_OUTPUT_ROOT}, which default to <repo>/data and
# <repo>/outputs when unset (src/sae_bioemu/core/paths.py). Placeholder expansion happens AFTER the
# config is fingerprinted, so pointing them elsewhere does not change a run's identity.
#
# The SAE hyperparameters are identical to configs/default.yaml. That is deliberate: this file
# exists to move the PATHS, not to propose different science. Change top_k or n_latents here freely
# for your own work -- but do not edit configs/default.yaml, whose SHA-256 is folded into every
# BioEmu steering checkpoint's training_code_fingerprint.
#
# REQUIREMENTS: a GPU, the bioemu-cuda extra, and network access. Embeddings are built lazily on
# first use, which issues a ColabFold MMseqs2 query per sequence and runs a JAX Evoformer pass.

sae:
  input_dim: 512
  n_latents: 4096
  top_k: 32
  aux_k: 256
  aux_k_coef: 0.03125
  dead_tokens_threshold: 1000000
  timestep_mlp_hidden_dim: 128
  use_time_conditioning: true
  normalize_inputs: true

trace:
  model_name: bioemu-v1.1
  target_module: model_nn.st_module.encoder.layers.-1
  denoiser_type: dpm
  denoiser_config_path:
  cache_so3_dir: ${SAE_DATA_ROOT}/processed/so3_cache
  recorded_score_calls: 10
  samples_per_sequence: 32
  save_final_structures: true
  final_structures_subdir: final_structures

training:
  activation_source: bioemu
  # Override on the command line with --input-fasta. The default points at the paper's training
  # split, which ships in the repository, so this config runs unmodified if you just want that.
  input_fasta: ${SAE_DATA_ROOT}/splits/uniref50_interpro_train_1000.fasta
  cache_embeds_dir: ${SAE_DATA_ROOT}/processed/embeds_cache_own_data
  runtime_structure_dir: ${SAE_OUTPUT_ROOT}/runtime_structures_own_data
  runtime_sequence_batch_size: 1
  runtime_activation_buffer_size: 32768
  output_dir: ${SAE_OUTPUT_ROOT}/sae_own_data
  batch_size: 8192
  epochs: 1
  learning_rate: 0.0001
  lr_scheduler: linear
  lr_warmup_steps: 300
  min_learning_rate: 0.00003
  weight_decay: 0.0
  metrics_interval: 50
  seed: 0
  device: auto
  mixed_precision: true

uniref50:
  num_clusters: 1000
  max_sequence_length: 300
  seed: 0

analysis:
  interpro_annotations_path: ${SAE_DATA_ROOT}/splits/interpro_eval_1000.jsonl
  evaluation_input_fasta: ${SAE_DATA_ROOT}/splits/uniref50_interpro_eval_1000.fasta
  evaluation_cache_embeds_dir: ${SAE_DATA_ROOT}/processed/embeds_cache_interpro_eval_1000
  evaluation_structure_dir: ${SAE_OUTPUT_ROOT}/runtime_structures_eval_1000
  evaluation_samples_per_sequence: 32
  concept_min_positive_residues: 100
  concept_min_positive_domains: 10
  concept_min_positive_sequences: 10
